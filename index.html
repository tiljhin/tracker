<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker · TIL JHIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* paleta da Bíblia Visual: carvão, placa, brasa escura, ouro antigo, creme, lava (uma cor só em todas as abas) */
  --bg: #0B0604; --card: #1A0F0B; --card2: #2A1510; --line: #3E0701;
  --txt: #F7C57B; --mut: #B8A598;
  --cor: #E3502A; --ouro: #E3A059; --cl: #FBD491;
  --rot: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse at top, color-mix(in srgb, var(--cor) 14%, transparent), transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--txt); font-family: 'Montserrat', sans-serif; min-height: 100vh;
  transition: background .4s;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 40px; }

header { position: relative; text-align: center; margin-bottom: 22px; }
.logo { font-family: var(--rot); font-size: 38px; letter-spacing: 3px; text-transform: uppercase; color: var(--cl); text-shadow: 0 0 18px color-mix(in srgb, var(--cor) 45%, transparent); transition: color .4s; }
.sub { color: var(--mut); font-size: 15px; margin-top: 2px; }

nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px; }
nav button {
  background: var(--card); border: 1px solid var(--line); color: var(--mut);
  font: 700 16px 'Montserrat', sans-serif; letter-spacing: 1px;
  padding: 12px 6px; border-radius: 10px; cursor: pointer; transition: all .2s;
}
nav button:hover { color: var(--txt); }
@media (max-width: 560px) { nav { gap: 5px; } nav button { font-size: 12px; letter-spacing: .5px; padding: 12px 2px; } }
nav button.on { color: var(--cl); border-color: var(--cor); background: color-mix(in srgb, var(--cor) 22%, var(--card)); }
nav button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; background: var(--cor); box-shadow: 0 0 8px var(--cor); }

.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; color: var(--mut); }
.pill { padding: 5px 12px; border-radius: 99px; font-weight: 700; font-size: 13px; letter-spacing: .5px; border: 1px solid var(--line); background: var(--card); }
.pill.ok { color: var(--cl); border-color: var(--cor); background: color-mix(in srgb, var(--cor) 25%, var(--card)); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.lbl { font-family: var(--rot); font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--ouro); margin-bottom: 6px; }
.lbl small { color: var(--mut); font-weight: 700; letter-spacing: 1px; margin-left: 6px; }
.big { font-family: var(--rot); font-size: 28px; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em; color: var(--cl); word-break: break-word; }
.who { color: var(--mut); margin-top: 4px; font-size: 15px; }
.tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--cl); background: color-mix(in srgb, var(--cor) 40%, transparent); vertical-align: middle; }
.tag.out { background: transparent; border: 1px solid var(--line); color: var(--mut); }

ol { list-style: none; }
ol li { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
ol li:first-child { border-top: 0; }
.n { min-width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; background: var(--card2); color: var(--cor); }
.nm { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; }
.nm small { display: block; font-weight: 400; color: var(--mut); font-size: 14px; }
ol li.sepl { display: block; padding: 12px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--mut); border-top: 1px dashed var(--line); }
ol li.risc { opacity: .5; }
ol li.risc .n { color: var(--mut); }
.vazio { color: var(--mut); text-align: center; padding: 10px 0; }

/* cassino: valores à direita, pódio e jarro */
.val { margin-left: auto; font-family: var(--rot); font-size: 17px; font-weight: 700; color: var(--cl); font-variant-numeric: tabular-nums; }
.n.pod { border: 1px solid var(--cor); }
.n.ouro { background: var(--cor); border-color: var(--cor); color: #0B0604; }
.big .moeda { font: 700 13px 'Montserrat', sans-serif; letter-spacing: 1px; color: var(--mut); }
.jar { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }

.como { font-size: 15px; line-height: 1.5; color: var(--mut); }
.como b { color: var(--txt); }
.btn { display: block; text-align: center; margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--cor); color: #0B0604; font-weight: 800; text-decoration: none; letter-spacing: 1px; }
footer { text-align: center; color: var(--mut); font-size: 13px; margin-top: 24px; }

/* ---------- calendário (histórico de feitos) ---------- */
.cal { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 6px; }
@media (max-width: 560px) { .cal { grid-template-columns: 1fr; } }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head button { background: none; border: 0; color: var(--cor); font: 700 22px 'Montserrat', sans-serif; cursor: pointer; padding: 0 8px; line-height: 1; }
.cal-head button:disabled { opacity: .2; cursor: default; }
.cal-mes { font-weight: 700; font-size: 16px; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--mut); text-align: center; padding: 4px 0; }
.cal-dia {
  position: relative; aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent;
  background: var(--card2); color: var(--mut); font: 700 13px 'Montserrat', sans-serif; cursor: default;
}
.cal-dia.tem { color: var(--txt); cursor: pointer; border-color: color-mix(in srgb, var(--cor) 40%, transparent); }
.cal-dia.tem:hover { border-color: var(--cor); }
.cal-dia.hoje { outline: 1px dashed var(--mut); outline-offset: -3px; }
.cal-dia.sel { background: var(--cor); border-color: var(--cor); color: #0B0604; }
.cal-n { position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--cor); }
.cal-dia.sel .cal-n { color: #0B0604; }
.cal-tit { font-family: var(--rot); font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--ouro); padding-bottom: 8px; border-bottom: 2px solid var(--cor); margin-bottom: 4px; }
.cal-lista { max-height: 320px; overflow-y: auto; }

/* ---------- modo admin (só com ?admin no link) ---------- */
.adm { display: flex; gap: 6px; margin-left: auto; }
.adm button, .dlg button, .rolbtns button {
  background: var(--card2); border: 1px solid var(--line); color: var(--txt);
  font: 700 12px 'Montserrat', sans-serif; letter-spacing: 1px;
  padding: 6px 10px; border-radius: 8px; cursor: pointer;
}
.adm button:hover, .dlg button:hover, .rolbtns button:hover { border-color: var(--cor); }
.adm button[data-acao="aceito"], .dlg button.pri { background: var(--cor); border-color: var(--cor); color: #0B0604; }
.adm-wait { margin-left: auto; font-size: 13px; color: var(--mut); }
.topo-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.topo-row > div:first-child { flex: 1; min-width: 0; }

/* controles da roleta (modo admin) */
.rolbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.rolbtns button { padding: 10px 14px; font-size: 13px; }
.rolbtns button[data-rol="girar"] { background: var(--cor); border-color: var(--cor); color: #0B0604; }
.rol-msg { min-height: 16px; margin-top: 8px; font-size: 13px; color: var(--mut); }

/* selo no topo, à direita (em cima do BIGOFLIX): 🔒 deslogado · ● ADMIN logado */
.adm-badge {
  position: absolute; top: 0; right: 0;
  background: var(--card); border: 1px solid var(--line); color: var(--txt);
  font: 700 12px 'Montserrat', sans-serif; letter-spacing: 1px;
  padding: 7px 11px; border-radius: 99px; cursor: pointer; transition: all .2s;
}
.adm-badge:hover { border-color: var(--cor); }
.adm-badge.on { color: var(--cl); border-color: var(--cor); background: color-mix(in srgb, var(--cor) 18%, var(--card)); }
.adm-badge.on::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cor); box-shadow: 0 0 8px var(--cor); margin-right: 6px; vertical-align: middle; }
.adm-badge.erro { color: var(--cl); border-color: var(--cor); }

/* popup */
.dlg { margin: auto; width: min(340px, calc(100% - 32px)); background: var(--card); color: var(--txt); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.dlg::backdrop { background: rgba(0, 0, 0, .6); }
.dlg input { width: 100%; margin-top: 6px; background: var(--card2); border: 1px solid var(--line); color: var(--txt); padding: 9px 10px; border-radius: 8px; font: 15px 'Montserrat', sans-serif; }
.dlg input:focus { outline: none; border-color: var(--cor); }
.dlg-msg { min-height: 18px; margin-top: 8px; font-size: 13px; color: var(--mut); }
.dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TIL JHIN</div>
    <div class="sub">Acompanhe a fila da live · Bigodinhos</div>
    <!-- modo admin: selo (só aparece com ?admin no link) -->
    <button id="admBadge" class="adm-badge" hidden></button>
  </header>

  <nav id="tabs">
    <button data-aba="dbd" data-nome="DBD">DBD</button>
    <button data-aba="over" data-nome="OVER">OVER</button>
    <button data-aba="flix" data-nome="BIGOFLIX">BIGOFLIX</button>
    <button data-aba="roleta" data-nome="ROLETA">ROLETA</button>
    <button data-aba="cassino" data-nome="CASSINO">CASSINO</button>
  </nav>

  <div class="status">
    <span id="pill" class="pill">carregando…</span>
    <span id="upd"></span>
  </div>

  <div id="topo"></div>

  <div class="card">
    <div class="lbl" id="filaLbl">NA FILA</div>
    <ol id="lista"></ol>
  </div>

  <div class="card" id="feitosCard" hidden>
    <div class="lbl" id="feitosLbl">FEITOS NESTA LIVE</div>
    <ol id="feitos"></ol>
  </div>

  <div class="card" id="calCard">
    <div class="lbl">HISTÓRICO<small id="calTot"></small></div>
    <div class="cal">
      <div>
        <div class="cal-head">
          <button id="calPrev" aria-label="Mês anterior">‹</button>
          <span class="cal-mes" id="calMes"></span>
          <button id="calNext" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div>
        <div class="cal-tit" id="calTit"></div>
        <ol class="cal-lista" id="calLista"></ol>
      </div>
    </div>
  </div>

  <div class="card" id="comoCard">
    <div class="lbl" id="comoLbl">COMO PEDIR</div>
    <div class="como" id="como"></div>
    <a class="btn" id="btnPix" target="_blank" rel="noopener">PEDIR PELO LIVEPIX</a>
  </div>

  <footer>@tiljhin em todas as redes</footer>
</div>

<!-- modo admin: popup -->
<dialog id="admDlg" class="dlg">
  <form id="admForm">
    <div class="lbl">MODO ADMIN</div>
    <div id="admLogin">
      <input id="admSenha" type="password" placeholder="senha do tracker" autocomplete="current-password">
    </div>
    <div class="dlg-msg" id="admMsg"></div>
    <div class="dlg-btns">
      <button type="button" id="admFechar">FECHAR</button>
      <button type="button" id="admSair" class="pri">SAIR</button>
      <button type="submit" id="admEntrar" class="pri">ENTRAR</button>
    </div>
  </form>
</dialog>

<script>
/* ================= CONFIGURE AQUI ================= */
const SUPABASE_URL = 'https://fglwlmuyfojabpilhcdc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZsrsSUmFlaPBKu_OeTGbMQ_zFKihTo4';   // a pública, que só lê
const LIVEPIX      = 'https://livepix.gg/tiljhin';
const ATUALIZAR_SEG = 5;    // de quanto em quanto tempo a página busca a fila
const ADMIN_SEG     = 2;    // no modo admin, busca mais rápido
const CAL_SEG       = 60;   // de quanto em quanto tempo o calendário se atualiza
const OFFLINE_MIN   = 30;   // sem atualização há X min = "live offline"

const ABAS = {
  dbd:  {  agora: 'KILLER AGORA', vazio: 'Nenhum killer na fila. Seja o primeiro!', outro: 'Overwatch',
          como: 'Mande um Pix pelo LivePix com o <b>nome do killer</b> na mensagem.<br><b>R$ 1</b> escolhe o killer · <b>R$ 2</b> escolhe com build (escreva "build").' },
  over: { agora: 'HERÓI AGORA',  vazio: 'Nenhum herói na fila. Seja o primeiro!', outro: 'DBD',
          como: 'Mande um Pix pelo LivePix com o <b>nome do herói</b> na mensagem.<br><b>R$ 1</b> escolhe o herói da próxima partida.' },
  flix: { agora: 'FILME DA SEMANA', vazio: 'Nenhum pedido de filme ainda.',
          como: 'Mande um Pix de <b>R$ 15</b> pelo LivePix com a palavra <b>filme</b> e o nome do filme na mensagem.' },
  roleta: { agora: 'GIRANDO AGORA', vazio: 'Nenhum giro na fila.', outro: '', como: '' },
  cassino: { agora: '', vazio: 'Ninguém no lucro este mês ainda. Seja o primeiro!', outro: '',
          como: 'Digite <b>!cassino</b> no chat da live (ou <b>!cassino 100</b> / <b>!cassino tudo</b>) e aposte seus <b>BIGOCOINS</b>.<br>O ranking é o saldo do mês (prêmios menos apostas) e zera todo mês. Só o <b>7 com bigode</b> leva o jarro.' }
};
// etiqueta de cada origem (igual ao HUD)
const TAGS = { doacao: 'PIX', sub: 'SUB', resub: 'RESUB', gift: 'GIFT', pontos: 'SUCOS' };
/* ================================================== */

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
let dados = {}, aba = null, timer = null;

// modo admin: link com ?admin · a senha fica salva só neste navegador
const ADMIN = new URLSearchParams(location.search).has('admin');
let senha = '';
try { senha = localStorage.getItem('trkSenha') || ''; } catch (e) {}
const pend = {}; // pedidos com clique enviado, esperando o HUD aplicar

function haQuanto(iso) {
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  return h < 24 ? `há ${h} h` : `há ${Math.floor(h / 24)} dia(s)`;
}

// a aba só conta como "com dado" depois que o HUD mandou alguma coisa
const temDado = d => d && Object.keys(d).length > 0;

function tags(i) {
  return (i.build ? '<span class="tag">BUILD</span>' : '')
       + (TAGS[i.origem] ? `<span class="tag${i.origem === 'pontos' ? ' out' : ''}">${TAGS[i.origem]}</span>` : '');
}

function botoes(i, noTopo) {
  if (!ADMIN || !senha || !i.id) return '';
  if (pend[i.id] && Date.now() - pend[i.id] < 15000) return '<span class="adm-wait">enviando…</span>';
  const b = (acao, txt) => `<button data-id="${esc(i.id)}" data-acao="${acao}">${txt}</button>`;
  return `<div class="adm">${noTopo ? '' : b('aceito', 'ACEITO')}${b('feito', 'FEITO')}${b('recusado', 'RECUSADO')}</div>`;
}

// ---------- ROLETA (aba própria: estado ao vivo + controle do admin) ----------
function mmss(s) { s = Math.max(0, Math.ceil(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

function renderRoleta(d, offline, recebeu, linha) {
  const fila = Array.isArray(d.fila) ? d.fila : [];
  const des = Array.isArray(d.desafios) ? d.desafios : [];
  const jogo = d.jogo === 'over' ? 'OVERWATCH' : 'DBD';

  // status
  let txt = 'Roleta offline', ok = false;
  if (!offline) { txt = d.girando ? 'Girando agora' : 'Roleta online'; ok = true; }
  $('pill').textContent = txt;
  $('pill').className = 'pill' + (ok ? ' ok' : '');
  $('upd').textContent = recebeu && linha.updated_at ? 'atualizado ' + haQuanto(linha.updated_at) : '';

  // topo: jogo, dobro e desafio atual (com cronômetro)
  const atual = des.find(x => x.inicio && !x.cumprido) || des.find(x => !x.inicio) || null;
  let topo = `<div class="card">
      <div class="lbl">JOGO NA RODA<small>${jogo}</small></div>
      <div class="big">${fila.length ? fila.length + (fila.length > 1 ? ' giros na fila' : ' giro na fila') : 'Fila vazia'}</div>
      <div class="who">${d.dobro ? 'Próxima doação vale em dobro' : 'Cada R$ de doação vira giros'}</div>
    </div>`;

  if (atual) {
    const resta = atual.inicio && !atual.cumprido ? atual.total - (Date.now() - new Date(atual.inicio)) / 1000 : atual.total;
    const rotulo = !atual.inicio ? 'DESAFIO AGUARDANDO' : (atual.cumprido ? 'DESAFIO CUMPRIDO' : 'DESAFIO EM ANDAMENTO');
    topo += `<div class="card">
      <div class="lbl">${rotulo}</div>
      <div class="topo-row">
        <div>
          <div class="big">${esc(atual.nome)}</div>
          <div class="who">${atual.quem ? '@' + esc(String(atual.quem).replace(/^@/, '')) : ''}</div>
        </div>
        <div class="big" style="font-size:28px;font-variant-numeric:tabular-nums">${atual.cumprido ? 'OK' : mmss(resta)}</div>
      </div>
    </div>`;
  }

  // controle do admin: só aparece com senha no modo admin
  if (ADMIN && senha) {
    topo += `<div class="card">
      <div class="lbl">CONTROLE DA ROLETA</div>
      <div class="rolbtns">
        <button data-rol="girar">▶ GIRAR PRÓXIMO</button>
        <button data-rol="desafio">⏱ DESAFIO</button>
        <button data-rol="limpar">LIMPAR FILA</button>
      </div>
      <div class="rol-msg" id="rolMsg"></div>
    </div>`;
  }
  $('topo').innerHTML = topo;

  // fila de giros (quem girou pagou)
  $('filaLbl').textContent = `GIROS NA FILA · ${fila.length}`;
  $('lista').innerHTML = fila.length
    ? fila.map((p, k) => `<li><span class="n">${k + 1}</span><div class="nm">Giro<small>${esc(p.quem)}</small></div></li>`).join('')
    : `<li><div class="vazio" style="width:100%">${ABAS.roleta.vazio}</div></li>`;

  // desafios na tela (aparecem no card de feitos)
  $('feitosLbl').textContent = 'DESAFIOS NA TELA';
  $('feitosCard').hidden = !des.length;
  $('feitos').innerHTML = des.map(x => `<li><span class="n">${x.cumprido ? '✔' : '⏱'}</span><div class="nm">${esc(x.nome)}<small>${x.quem ? '@' + esc(String(x.quem).replace(/^@/, '')) : ''}</small></div></li>`).join('');

  $('comoCard').hidden = true;
}

// ---------- CASSINO (aba própria: líder, jarro, top do mês e hall de jackpots) ----------
const fmtN = v => Number(v || 0).toLocaleString('pt-BR');
const plural = (n, um, varios) => `${fmtN(n)} ${n === 1 ? um : varios}`;

function renderCassino(d, offline, recebeu, linha) {
  const top = Array.isArray(d.top) ? d.top : [];
  const hall = Array.isArray(d.hall) ? d.hall : [];
  const moeda = esc(d.moeda || 'BIGOCOINS');
  const mes = esc(d.mesNome || '');

  $('pill').textContent = offline ? 'Cassino offline' : 'Cassino aberto';
  $('pill').className = 'pill' + (offline ? '' : ' ok');
  $('upd').textContent = recebeu && linha.updated_at ? 'atualizado ' + haQuanto(linha.updated_at) : '';

  // topo: líder do mês, jarro e pódio do mês passado
  const lider = top[0];
  let t = `<div class="card">
      <div class="lbl">LÍDER${mes ? ' DE ' + mes : ' DO MÊS'}</div>
      <div class="big">${lider ? esc(lider.nome) : 'Ninguém no lucro ainda'}</div>
      <div class="who">${lider ? '+' + fmtN(lider.liquido) + ' ' + moeda + ' no mês' : 'Digite !cassino no chat da live'}</div>
    </div>`;
  if (d.jarro !== undefined) t += `<div class="card">
      <div class="lbl">JARRO DO JACKPOT</div>
      <div class="big jar">${fmtN(d.jarro)}<span class="moeda">${moeda}</span></div>
      <div class="who">Quem tirar 7-7-7 leva o jarro inteiro</div>
    </div>`;
  const ant = d.anterior && Array.isArray(d.anterior.top) ? d.anterior.top : [];
  if (ant.length) t += `<div class="card">
      <div class="lbl">PÓDIO DE ${esc((MESES[Number(String(d.anterior.mes).slice(5, 7)) - 1] || '').toUpperCase())}</div>
      <ol>${ant.map((p, k) => `<li><span class="n${k === 0 ? ' ouro' : ' pod'}">${k + 1}</span><div class="nm">${esc(p.nome)}</div><b class="val">+${fmtN(p.liquido)}</b></li>`).join('')}</ol>
    </div>`;
  $('topo').innerHTML = t;

  // top do mês
  $('filaLbl').innerHTML = `TOP DO MÊS${mes ? ' · ' + mes : ''}<small>${recebeu ? '· ' + plural(d.giros, 'giro', 'giros') : ''}</small>`;
  $('lista').innerHTML = top.length
    ? top.map((p, k) => `<li><span class="n${k === 0 ? ' ouro' : (k < 3 ? ' pod' : '')}">${k + 1}</span><div class="nm">${esc(p.nome)}<small>${plural(p.giros, 'giro', 'giros')} · ${plural(p.vitorias, 'vitória', 'vitórias')}</small></div><b class="val">+${fmtN(p.liquido)}</b></li>`).join('')
    : `<li><div class="vazio" style="width:100%">${ABAS.cassino.vazio}</div></li>`;

  // hall dos jackpots (não zera na virada do mês)
  $('feitosLbl').textContent = 'HALL DOS JACKPOTS';
  $('feitosCard').hidden = !hall.length;
  $('feitos').innerHTML = hall.map(x => `<li><span class="n ouro">7</span><div class="nm">${esc(x.n)}<small>${haQuanto(x.em)}${x.a ? ' · aposta de ' + fmtN(x.a) : ''}</small></div><b class="val">+${fmtN(x.v)}</b></li>`).join('');

  $('como').innerHTML = ABAS.cassino.como;
  $('comoLbl').textContent = 'COMO JOGAR';
  $('comoCard').hidden = false;
  $('btnPix').hidden = true;
}

/* ---------- CALENDÁRIO (histórico de feitos, por dia) ---------- */
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const hojeD = new Date();
const cal = { y: hojeD.getFullYear(), m: hojeD.getMonth(), dia: null, linhas: [] };

async function carregarMes() {
  const ini = new Date(cal.y, cal.m, 1).toISOString();
  const fim = new Date(cal.y, cal.m + 1, 1).toISOString();
  const cab = { headers: { apikey: SUPABASE_KEY } };
  try {
    const [r1, r2] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/tracker_hist?select=aba,quem,escolha,build,origem,feito_em&and=(feito_em.gte.${ini},feito_em.lt.${fim})&order=feito_em.asc`, cab),
      fetch(`${SUPABASE_URL}/rest/v1/roleta_hist?select=quem,resultado,jogo,created_at&and=(created_at.gte.${ini},created_at.lt.${fim})&order=created_at.asc`, cab)
    ]);
    const a = r1.ok ? await r1.json() : [];
    const b = r2.ok ? await r2.json() : [];
    // giros da roleta entram no calendário com o mesmo formato dos outros
    cal.linhas = a.concat(b.map(x => ({ aba: 'roleta', quem: x.quem, escolha: x.resultado, build: false, origem: '', feito_em: x.created_at })));
    renderCal();
  } catch (e) {}
}

function renderCal() {
  if (!aba) return;
  const porDia = {};
  cal.linhas.filter(l => l.aba === aba).forEach(l => {
    const d = new Date(l.feito_em).getDate();
    (porDia[d] = porDia[d] || []).push(l);
  });
  const dias = Object.keys(porDia).map(Number);
  const totalMes = dias.reduce((s, d) => s + porDia[d].length, 0);

  // dia aberto: o escolhido · senão hoje (se tiver pedido) · senão o último dia com pedido
  const ehMesAtual = cal.y === hojeD.getFullYear() && cal.m === hojeD.getMonth();
  let dia = cal.dia;
  if (!dia || !porDia[dia]) dia = (ehMesAtual && porDia[hojeD.getDate()]) ? hojeD.getDate() : (dias.length ? Math.max(...dias) : null);

  $('calMes').textContent = `${MESES[cal.m]} ${cal.y}`;
  $('calNext').disabled = ehMesAtual;
  $('calTot').textContent = totalMes ? `· ${totalMes} no mês` : '';

  let g = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'].map(x => `<div class="cal-dow">${x}</div>`).join('');
  const primeiro = new Date(cal.y, cal.m, 1).getDay();
  const total = new Date(cal.y, cal.m + 1, 0).getDate();
  for (let i = 0; i < primeiro; i++) g += '<div></div>';
  for (let d = 1; d <= total; d++) {
    const n = (porDia[d] || []).length;
    const cls = 'cal-dia' + (n ? ' tem' : '') + (ehMesAtual && d === hojeD.getDate() ? ' hoje' : '') + (d === dia ? ' sel' : '');
    g += `<button class="${cls}" data-dia="${d}"${n ? '' : ' disabled'}>${d}${n ? `<span class="cal-n">${n}</span>` : ''}</button>`;
  }
  $('calGrid').innerHTML = g;

  const lista = dia ? porDia[dia] : [];
  const rotulo = aba === 'roleta' ? 'GIROS' : 'FEITOS';
  $('calTit').textContent = dia ? `${rotulo} EM ${pad(dia)}/${pad(cal.m + 1)}/${cal.y}` : 'NADA REGISTRADO NESTE MÊS';
  $('calLista').innerHTML = lista.length
    ? lista.map(l => {
        const t = new Date(l.feito_em);
        return `<li><span class="n">✔</span><div class="nm">${esc(l.escolha)}${tags(l)}<small>${esc(l.quem)} · ${pad(t.getHours())}:${pad(t.getMinutes())}</small></div></li>`;
      }).join('')
    : `<li><div class="vazio" style="width:100%">Os dias marcados no calendário têm registros.</div></li>`;
}

$('calGrid').addEventListener('click', e => {
  const b = e.target.closest('.cal-dia.tem');
  if (!b) return;
  cal.dia = parseInt(b.dataset.dia, 10);
  renderCal();
});
$('calPrev').addEventListener('click', () => { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } cal.dia = null; cal.linhas = []; renderCal(); carregarMes(); });
$('calNext').addEventListener('click', () => { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } cal.dia = null; cal.linhas = []; renderCal(); carregarMes(); });

/* ---------- BUSCA ---------- */
async function rpc(fn, body) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return r.ok;
  } catch (e) { return false; }
}

async function buscar() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/tracker?select=id,data,updated_at`, { headers: { apikey: SUPABASE_KEY } });
    if (!r.ok) throw new Error(r.status);
    dados = Object.fromEntries((await r.json()).map(l => [l.id, l]));
    if (!aba) aba = ABAS[location.hash.slice(1)] ? location.hash.slice(1) : (dados.over?.data?.ativo === true ? 'over' : 'dbd');
    // o HUD já aplicou o clique (a aba foi atualizada depois dele): libera o botão
    const upd = new Date(dados[aba]?.updated_at || 0).getTime();
    Object.keys(pend).forEach(id => { if (upd > pend[id] || Date.now() - pend[id] > 15000) delete pend[id]; });
    render();
  } catch (e) {
    $('pill').textContent = 'sem conexão';
    $('pill').className = 'pill';
  }
}

function render() {
  if (!aba) return;
  $('calCard').hidden = aba === 'cassino';
  const a = ABAS[aba], linha = dados[aba] || {}, d = linha.data || {};
  const recebeu = temDado(d);
  const offline = !recebeu || !linha.updated_at || (Date.now() - new Date(linha.updated_at)) / 60000 > OFFLINE_MIN;

  // abas: pontinho lava no jogo que está ativo na live
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.aba === aba);
    const ativo = !['flix', 'roleta', 'cassino'].includes(b.dataset.aba) && dados[b.dataset.aba]?.data?.ativo === true;
    b.innerHTML = b.dataset.nome + (ativo ? '<span class="dot"></span>' : '');
  });

  // aba da roleta: tela própria
  if (aba === 'roleta') { renderRoleta(d, offline, recebeu, linha); renderCal(); return; }
  if (aba === 'cassino') return renderCassino(d, offline, recebeu, linha);
  $('comoLbl').textContent = 'COMO PEDIR';
  $('comoCard').hidden = false;
  $('btnPix').hidden = false;
  $('feitosLbl').textContent = 'FEITOS NESTA LIVE';

  // status
  let txt = 'Live offline', ok = false;
  if (!offline) {
    if (aba === 'flix') { txt = 'Pedidos abertos'; ok = true; }
    else if (d.ativo !== true) txt = `Fila pausada · live em ${a.outro}`;
    else if (d.aberta === false) txt = 'Fila fechada';
    else { txt = 'Fila aberta'; ok = true; }
  }
  $('pill').textContent = txt;
  $('pill').className = 'pill' + (ok ? ' ok' : '');
  $('upd').textContent = recebeu && linha.updated_at ? 'atualizado ' + haQuanto(linha.updated_at) : '';

  // topo: AGORA (DBD/Over) ou filme da semana (BigoFlix)
  const top = aba === 'flix' ? d.filme : d.atual;
  if (top) {
    const titulo = aba === 'flix' ? top.titulo : top.escolha;
    const who = aba === 'flix' ? (top.onde || (top.quem ? 'pedido de ' + top.quem : '')) : 'pedido de ' + top.quem;
    $('topo').innerHTML = `
      <div class="card">
        <div class="lbl">${a.agora}</div>
        <div class="topo-row">
          <div>
            <div class="big">${esc(titulo)}</div>
            <div class="who">${esc(who)}${aba === 'flix' ? '' : tags(top)}</div>
          </div>
          ${botoes(top, true)}
        </div>
      </div>`;
  } else $('topo').innerHTML = '';

  // fila: pagos em cima, divisória, pedidos com SUCOS, e os recusados riscados no fim
  const fila = Array.isArray(d.fila) ? d.fila : [];
  const rec = Array.isArray(d.recusados) ? d.recusados : [];
  $('filaLbl').textContent = `NA FILA · ${fila.length}`;
  let h = '';
  fila.forEach((i, k) => {
    if (i.origem === 'pontos' && (k === 0 || fila[k - 1].origem !== 'pontos')) h += '<li class="sepl">PEDIDOS COM SUCOS</li>';
    h += `<li><span class="n">${k + 1}</span><div class="nm">${esc(i.escolha)}${tags(i)}<small>${esc(i.quem)}</small></div>${botoes(i)}</li>`;
  });
  if (!fila.length) h += `<li><div class="vazio" style="width:100%">${a.vazio}</div></li>`;
  if (rec.length) {
    h += '<li class="sepl">RECUSADOS</li>';
    rec.forEach(i => { h += `<li class="risc"><span class="n">✕</span><div class="nm"><s>${esc(i.escolha)}</s><small>${esc(i.quem)}</small></div></li>`; });
  }
  $('lista').innerHTML = h;

  // feitos nesta live
  const feitos = Array.isArray(d.feitos) ? d.feitos : [];
  $('feitosCard').hidden = !feitos.length;
  $('feitos').innerHTML = feitos.map(i => `<li><span class="n">✔</span><div class="nm">${esc(i.escolha)}${i.build ? '<span class="tag">BUILD</span>' : ''}<small>${esc(i.quem)}</small></div></li>`).join('');

  $('como').innerHTML = a.como;
  $('btnPix').href = LIVEPIX;

  renderCal();
}

let calTimer = null;
function ciclo() {
  clearInterval(timer);
  clearInterval(calTimer);
  if (document.hidden) return;
  buscar();
  carregarMes();
  timer = setInterval(buscar, (ADMIN ? ADMIN_SEG : ATUALIZAR_SEG) * 1000);
  calTimer = setInterval(carregarMes, CAL_SEG * 1000);
}

/* ---------- MODO ADMIN ---------- */
let erroT = null;

// selo do topo: 🔒 deslogado · ● ADMIN logado
function admUI() {
  if (!ADMIN) return;
  const b = $('admBadge');
  b.hidden = false;
  b.className = 'adm-badge' + (senha ? ' on' : '');
  b.textContent = senha ? 'ADMIN' : '🔒 ADMIN';
  b.title = senha ? 'Modo admin ativo' : 'Entrar no modo admin';
}

// erro rápido no selo (some em 4 s)
function avisar(t) {
  const b = $('admBadge');
  b.className = 'adm-badge erro';
  b.textContent = '⚠ ' + t;
  clearTimeout(erroT);
  erroT = setTimeout(admUI, 4000);
}

function abrirPopup(msg) {
  $('admLogin').hidden = !!senha;
  $('admEntrar').hidden = !!senha;
  $('admSair').hidden = !senha;
  $('admMsg').textContent = msg || (senha
    ? 'ACEITO vira o AGORA · FEITO vai pro histórico · RECUSADO fica riscado.'
    : 'Digite a senha do tracker (a mesma do HUD).');
  $('admSenha').value = '';
  $('admDlg').showModal();
  if (!senha) $('admSenha').focus();
}

$('admBadge').addEventListener('click', () => abrirPopup());
$('admFechar').addEventListener('click', () => $('admDlg').close());
$('admDlg').addEventListener('click', e => { if (e.target === $('admDlg')) $('admDlg').close(); }); // clique fora fecha

$('admForm').addEventListener('submit', async e => {
  e.preventDefault();
  const s = $('admSenha').value.trim();
  if (!s) return;
  $('admMsg').textContent = 'conferindo…';
  const ok = await rpc('tracker_acao', { segredo: s, p_item: '', p_acao: 'login' });
  if (!ok) { $('admMsg').textContent = 'Senha errada.'; return; }
  senha = s;
  try { localStorage.setItem('trkSenha', s); } catch (e) {}
  $('admDlg').close();
  admUI(); render();
});

$('admSair').addEventListener('click', () => {
  senha = '';
  try { localStorage.removeItem('trkSenha'); } catch (e) {}
  $('admDlg').close();
  admUI(); render();
});

document.addEventListener('click', async e => {
  const b = e.target.closest('.adm button');
  if (!b) return;
  const { id, acao } = b.dataset;
  pend[id] = Date.now();
  render();
  const ok = await rpc('tracker_acao', { segredo: senha, p_item: id, p_acao: acao });
  if (!ok) { delete pend[id]; avisar('erro'); render(); }
  else if (acao === 'feito') setTimeout(carregarMes, 8000); // o calendário pega o feito novo logo
});

// controle da roleta: manda o clique para a fila que a roleta lê a cada 2 s
document.addEventListener('click', async e => {
  const b = e.target.closest('.rolbtns button');
  if (!b) return;
  if (!senha) return abrirPopup();
  const acao = b.dataset.rol;
  if (acao === 'limpar' && !confirm('Zerar a fila de giros da roleta?')) return;
  const msg = $('rolMsg');
  if (msg) msg.textContent = 'enviando…';
  const ok = await rpc('roleta_acao', { segredo: senha, p_acao: acao });
  if (msg) msg.textContent = ok ? 'Enviado. A roleta pega em instantes.' : 'Erro ao enviar.';
  if (!ok) avisar('erro');
});

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  aba = b.dataset.aba; cal.dia = null; history.replaceState(null, '', '#' + aba); render();
});
document.addEventListener('visibilitychange', ciclo);
admUI();
ciclo();
</script>
